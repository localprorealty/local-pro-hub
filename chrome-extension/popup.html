<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LocalPRO Hub Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header style="position: relative;">
      <h1>LocalPRO Hub Helper</h1>
      <button id="settings-toggle-btn" class="icon-btn" title="Settings" style="position: absolute; right: 0; top: 0; background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CFB87C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Settings Section -->
    <div id="settings-section" class="section hidden" style="border-bottom: 1px solid var(--color-border); padding-bottom: 14px; margin-bottom: 14px;">
      <p class="section-title" style="margin-bottom: 8px;">Settings</p>
      <div class="form-group">
        <label for="api-url-input">API Base URL</label>
        <input type="text" id="api-url-input" placeholder="https://local-pro-hub-production.up.railway.app">
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="save-settings-btn" class="btn primary-btn" style="flex: 1; padding: 8px; font-size: 12px;">Save URL</button>
        <button id="reset-settings-btn" class="btn secondary-btn" style="flex: 1; padding: 8px; font-size: 12px;">Reset Default</button>
      </div>
      <p id="settings-status" class="success-msg" style="margin-top: 8px; font-size: 11px; text-align: center;"></p>
    </div>

    <!-- Login Form -->
    <div id="login-section" class="section">
      <p class="subtitle">Log in using your LocalPRO credentials.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" id="login-btn" class="btn primary-btn">Log In</button>
      </form>
      <p id="login-error" class="error-msg"></p>
    </div>

    <!-- Active Listing Section -->
    <div id="main-section" class="section hidden">
      <div class="user-info">
        <span>Logged in as <strong id="user-name">Agent</strong></span>
        <button id="logout-btn" class="text-link">Log Out</button>
      </div>

      <hr class="divider">

      <p class="section-title">Select Active Listing</p>
      <div class="form-group">
        <label for="listing-id">Listing ID</label>
        <input type="text" id="listing-id" placeholder="Paste Supabase listing UUID...">
      </div>
      <button id="load-btn" class="btn primary-btn">Load Listing</button>
      <p id="load-error" class="error-msg"></p>
      <p id="load-success" class="success-msg"></p>

      <!-- Loaded Listing Preview -->
      <div id="listing-preview" class="preview-card hidden">
        <p class="card-label">Active Property</p>
        <p id="property-address" class="address-text"></p>
        <div class="details-row">
          <span>MLS: <strong id="property-mls">-</strong></span>
          <span>Price: <strong id="property-price">-</strong></span>
        </div>
      </div>

      <!-- Action Section -->
      <div id="action-section" class="hidden" style="margin-top: 16px;">
        <button id="fill-active-page-btn" class="btn primary-btn" disabled>Fill Active Page</button>
        <div class="nav-row" style="display: flex; gap: 8px; margin-top: 8px;">
          <button id="prev-page-btn" class="btn secondary-btn" style="flex: 1;" disabled>Prev Page</button>
          <button id="next-page-btn" class="btn secondary-btn" style="flex: 1;" disabled>Next Page</button>
        </div>
        <p id="fill-status" class="success-msg" style="margin-top: 8px; min-height: 0;"></p>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
